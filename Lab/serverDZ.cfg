// AssistZ lab server: local only, one player, no BattlEye (DayZDiag client), no signature checks.
hostname = "AssistZ Lab";
password = "";
passwordAdmin = "";
maxPlayers = 2;  // listener + a second client; NOTE: a second client on the SAME Steam account is rejected (steamID already in use) once both are in
verifySignatures = 0;
// The DayZDiag client runs with -filePatching; without this the server kicks it
// ("The server does not accept the client's current filePatching setting").
allowFilePatching = 1;
forceSameBuild = 1;
disableVoN = 1;
BattlEye = 0;
enableWhitelist = 0;
disable3rdPerson = 0;
disableCrosshair = 0;
serverTime = "SystemTime";
serverTimeAcceleration = 1;
serverNightTimeAcceleration = 1;
serverTimePersistent = 0;
guaranteedUpdates = 1;
loginQueueConcurrentPlayers = 5;
loginQueueMaxPlayers = 500;
instanceId = 1;
storageAutoFix = 1;

class Missions
{
    class DayZ
    {
        template = "dayzOffline.chernarusplus";
    };
};
