name: Deploy to GitHub Pages

# By hand, so the live page stays steady while work goes on.
on: workflow_dispatch

jobs:
  deploy-to-github-pages:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10'

    - name: Install .NET WASM build tools
      run: dotnet workload install wasm-tools

    - name: Run the unit tests
      run: dotnet test ./AssistZ.Tests/ --nologo -c Release

    - name: Publish the app
      run: dotnet publish ./AssistZ/ --nologo -c Release --output publish

    # The same file for any path GitHub Pages does not know, so links like /icons work.
    - name: Copy index.html to 404.html
      run: cp publish/wwwroot/index.html publish/wwwroot/404.html

    # Allow folders starting with an underscore, such as _framework.
    - name: Add .nojekyll
      run: touch publish/wwwroot/.nojekyll

    - name: Commit wwwroot to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: publish/wwwroot
